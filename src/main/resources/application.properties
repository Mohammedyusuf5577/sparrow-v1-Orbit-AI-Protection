# ============================================
# ORBIT Backend - Application Configuration
# ============================================
# Secrets are NOT stored here. Provide them either as environment variables
# (see .env.example) or in src/main/resources/application-local.properties
# (gitignored, imported below; its values override the ${...} placeholders).
spring.config.import=optional:classpath:application-local.properties

spring.application.name=orbit-backend

# ---- Server Configuration ----
server.port=8080

# ---- Database Configuration ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgresql_v1_orbit_co_in}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA Configuration ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Flyway Migration ----
spring.flyway.enabled=false
spring.flyway.locations=classpath:database/migration
spring.flyway.baseline-on-migrate=true

# ---- JWT Configuration ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ---- AI Monitoring Scheduler ----
app.ai.monitoring.rate=3600000
app.ai.risk.threshold=50

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---- Logging ----
logging.level.com.orbit=DEBUG
logging.level.org.springframework.security=DEBUG

# ---- Razorpay Configuration ----
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.account.number=${RAZORPAY_ACCOUNT_NUMBER}
razorpay.payout.mode=IMPS
razorpay.payout.purpose=salary
razorpay.contact.type=employee

# ---- Encryption ----
app.encryption.secret=${ENCRYPTION_SECRET}

# ---- Scheduler ----
app.payroll.scheduler.cron=0 0 9 * * ?
app.payroll.retry.max-attempts=3
