# ============================================
# ORBIT Backend - STAGE profile
# ============================================
# Activate with:  SPRING_PROFILES_ACTIVE=stage
#            or:  ./gradlew bootRun --args='--spring.profiles.active=stage'
# Overrides application.properties. NO secrets here: the stage DB password
# comes from the STAGE_DB_PASSWORD env var (or the gitignored
# application-local.properties). Host/port/name/user can be overridden by env.

# ---- Stage Database (separate from the dev database) ----
spring.datasource.url=jdbc:postgresql://${STAGE_DB_HOST:localhost}:${STAGE_DB_PORT:5432}/${STAGE_DB_NAME:postgresql_stage_v1_orbit_co_in}
spring.datasource.username=${STAGE_DB_USERNAME:orbit_stage_user}
spring.datasource.password=${STAGE_DB_PASSWORD}

# ---- Quieter logs than dev (no SQL dump / security DEBUG on stage) ----
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.orbit=INFO
logging.level.org.springframework.security=INFO
